version: "3.9"
services:
  postgres:
    image: postgres:latest
    restart: always
    env_file:
      - ../.env # docker/에서 한 단계 위 루트의 .env
    environment:
      POSTGRES_HOST: ${DB_HOST}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
      PGDATA: /var/lib/postgresql/data
      TZ: Asia/Seoul
    command: ["postgres", "-c", "timezone=Asia/Seoul"]
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"

  redis:
    image: redis/redis-stack-server:latest
    container_name: redis-stack
    restart: always
    ports:
      - "6380:6379"
    volumes:
      - ./redis-data:/data

  neo4j:
    image: neo4j:latest
    container_name: neo4j
    restart: unless-stopped
    env_file:
      - ../.env
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=${NEO4J_AUTH}
      - NEO4J_PLUGINS=["apoc", "graph-data-science"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*,gds.*
      - NEO4J_dbms_memory_heap_initial__size=512m
      - NEO4J_dbms_memory_heap_max__size=2G
      - NEO4J_dbms_memory_pagecache_size=1G
    volumes:
      - ./database/neo4j/data:/data
      - ./database/neo4j/logs:/logs
      - ./database/neo4j/import:/var/lib/neo4j/import
      - ./database/neo4j/plugins:/plugins
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:7474"]
      interval: 10s
      timeout: 5s
      retries: 5

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.1
    container_name: elasticsearch
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=true
      - xpack.security.http.ssl.enabled=false
      - xpack.security.transport.ssl.enabled=false
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
      - KIBANA_PASSWORD=${KIBANA_PASSWORD}
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
      - network.host=0.0.0.0
      - cluster.name=elasticsearch-cluster
      - node.name=elasticsearch-node-1
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - ./database/elasticsearch:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -u elastic:${ELASTIC_PASSWORD} -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  setup:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.1
    container_name: elasticsearch-setup
    env_file:
      - ../.env
    depends_on:
      elasticsearch:
        condition: service_healthy
    command: >
      bash -c "
        echo 'Waiting for Elasticsearch to be ready...';
        until curl -s -u elastic:${ELASTIC_PASSWORD} http://elasticsearch:9200/_cluster/health | grep -q 'yellow\\|green'; do
          sleep 5;
        done;
        echo 'Setting kibana_system password...';
        curl -X POST -u elastic:${ELASTIC_PASSWORD} \
          http://elasticsearch:9200/_security/user/kibana_system/_password \
          -H 'Content-Type: application/json' \
          -d \"{\\\"password\\\":\\\"${KIBANA_PASSWORD}\\\"}\";
        echo '';
        echo 'kibana_system password has been set successfully!';
      "
    restart: "no"

  kibana:
    image: docker.elastic.co/kibana/kibana:8.12.1
    container_name: kibana
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - ELASTICSEARCH_USERNAME=kibana_system
      - ELASTICSEARCH_PASSWORD=${KIBANA_PASSWORD}
      - SERVER_NAME=kibana
      - SERVER_HOST=0.0.0.0
      - I18N_LOCALE=ko-KR
    ports:
      - "5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
      setup:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5601/api/status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
